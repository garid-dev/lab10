<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>Лаб 10 | Цомгийн өгөгдөл боловсруулах</title>
    <link rel="stylesheet" href="lab10.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <a class="back-link" href="lab9.html">← Лаб 9</a>
        <p class="eyebrow">JAVASCRIPT · ЛАБ 10</p>
        <h1>Зургийн цомог</h1>
        <p class="intro">Функц, массив, объект болон class ашиглан цомгийн өгөгдлийг боловсруулах.</p>
      </header>

      <section class="toolbar" aria-label="Зураг шүүх">
        <label class="control">
          <span>Хайлт</span>
          <input id="search" type="search" placeholder="Зураг эсвэл tag…" autocomplete="off">
        </label>
        <label class="control">
          <span>Байршил</span>
          <input id="place-filter" type="search" placeholder="Бүх байршил" autocomplete="off">
        </label>
        <label class="control">
          <span>Эрэмбэ</span>
          <select id="sort-order">
            <option value="desc">Шинэ эхэнд</option>
            <option value="asc">Хуучин эхэнд</option>
          </select>
        </label>
        <p id="photo-count" class="photo-count" aria-live="polite"></p>
      </section>

      <section aria-labelledby="gallery-title">
        <h2 id="gallery-title" class="visually-hidden">Зургийн цомог</h2>
        <div id="photo-grid" class="photo-grid" aria-live="polite"></div>
      </section>

      <section class="add-section" aria-labelledby="add-title">
        <div>
          <p class="eyebrow">ШИНЭ ДУРСАМЖ</p>
          <h2 id="add-title">Зураг нэмэх</h2>
        </div>
        <form id="photo-form" class="photo-form" novalidate>
          <label class="control">
            <span>Зургийн нэр</span>
            <input name="title" type="text" minlength="2" maxlength="50" required>
          </label>
          <label class="control">
            <span>Байршил</span>
            <input name="place" type="text" minlength="2" maxlength="50" required>
          </label>
          <label class="control">
            <span>Огноо</span>
            <input name="date" type="date" required>
          </label>
          <div class="form-actions">
            <button type="submit" class="add-button">Цомогт нэмэх</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
      <footer>
        <a href="lab10-report.md">Тайлан ба browser compatibility</a>
      </footer>
    </main>
  </body>
</html>
